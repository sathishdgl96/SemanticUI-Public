name: CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
  schedule:
    # Weekly, so NEW CVEs surface without a code change to trigger them.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (locked)
        run: |
          pip install -r requirements.lock
          pip install -e .[dev]
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history; a shallow clone would hide old leaks.
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

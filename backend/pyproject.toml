[project]
name = "semanticui-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "xlsxwriter>=3.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "snowflake-connector-python>=3.12",
    "httpx>=0.27",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# openpyxl is a TEST dependency only: the export tests read the generated
# workbook back with a different library than the one that wrote it.
dev = ["pytest>=8", "pytest-mock>=3.14", "openpyxl>=3.1", "ruff>=0.6", "lxml>=5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
#: The CI-enforced floor: syntax errors, undefined names, unused code.
#: The stricter set (I, B, S) lands with the D2.1 cleanup pass -- widening
#: the net is deliberate work, not a default.
select = ["E9", "F"]

[tool.pytest.ini_options]
markers = ["integration: tests that need a real Snowflake account (env-gated)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
